name: Docker Image CI

on:
  push:
    branches: [ main, dev, development ]


jobs:

  build:

    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - uses: actions/checkout@v2
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set current date as env variable
        run: |
          echo "RELEASE_DATE=$(date -d "-5 hours" -u +"%Y_%m_%dT%H_%M_%S")" >> ${GITHUB_ENV}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: socobox/iwg-pcr-backend
          tags: |
            type=sha,format=short,prefix={{branch}}-${{ env.RELEASE_DATE }}-
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Slack Notification
        uses: act10ns/slack@v1
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          message: Docker_image -> ${{steps.meta.outputs.tags}} with status -> ${{job.status}}'
        if: always()

